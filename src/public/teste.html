<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Teste do Mychat Widget</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f8fafc; }
        .card { background: white; padding: 24px; border-radius: 8px; max-width: 600px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-abrir-chat {
            display: inline-block;
            margin-top: 20px;
            background: #A00028;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-abrir-chat:hover { background: #800020; }
        .btn-abrir-chat:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div class="card">
        <h1>Página de Teste - Mychat</h1>
        <p>Esta página simula o ambiente do morador logado no site/portal.</p>
        <p>O botão flutuante padrão aparecerá no canto inferior direito.</p>
        
        <!-- Novo botão consumindo a API pública do Widget -->
        <button class="btn-abrir-chat" onclick="window.Mychat.abrir()">
            💬 Clique aqui para falar com um Atendente
        </button>
    </div>

    <!-- Script de Inicialização do Widget -->
    <script>
      (function(w, d, s, o, f, js, fjs) {
        w['MychatObject'] = o;
        w[o] = w[o] || function() { (w[o].q = w[o].q || []).push(arguments) };
        js = d.createElement(s); fjs = d.getElementsByTagName(s)[0];
        js.id = o; js.src = f; js.async = 1; fjs.parentNode.insertBefore(js, fjs);
      })(window, document, 'script', 'mychat', '/js/widget.js');

      // Simulação de dados verificados do morador
      mychat('init', {
        appUrl: window.location.origin,
        cliente: {
          nome: "Carlos Eduardo (Teste)",
          email: "dehon.silva@lello.com.br",
          contrato: "LC-2026-99881",
          imovel: "Apto 42 - Bloco B"
        }
      });
    </script>
</body>
</html>

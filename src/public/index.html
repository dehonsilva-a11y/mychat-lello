<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mychat - Lello</title>
    
    <script>
        window.prefixoApp = window.location.pathname.match(/^(\/poc\/\d+)/)?.[1] || '';
    </script>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <div id="app-container">
        <div id="widget-chat" class="chat-container">
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="logo-lello" src="assets/logo.png" alt="Lello" style="height: 24px;">
                    <span>Mychat - Atendimento</span>
                </div>
            </div>

            <!-- Corpo das Mensagens e Formulário -->
            <div id="chat-messages" class="chat-body">
                <!-- FORMULÁRIO DE TRIAGEM -->
                <div id="form-triagem" class="form-triagem-box">
                    <h4 id="titulo-triagem">Preencha os seus dados</h4>
                    
                    <div class="campo-triagem" id="box-triagem-nome">
                        <label for="triagem-nome">Nome *</label>
                        <input type="text" id="triagem-nome" placeholder="Seu nome">
                    </div>
                    
                    <div class="campo-triagem" id="box-triagem-email">
                        <label for="triagem-email">E-mail *</label>
                        <input type="email" id="triagem-email" placeholder="seu@email.com">
                    </div>

                    <div class="campo-triagem">
                        <label for="triagem-assunto">Assunto *</label>
                        <select id="triagem-assunto">
                            <option value="">A carregar assuntos...</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Rodapé 1: Botão Inicial -->
            <div id="footer-iniciar" class="chat-footer">
                <button class="btn-primary" onclick="iniciarAtendimentoComTriagem()">Iniciar Atendimento</button>
            </div>

            <!-- Rodapé 2: Campo de Entrada de Texto com Botão de Anexo (Inicia Oculto) -->
            <div id="footer-input" class="chat-footer" style="display: none; align-items: center; gap: 6px;">
                <!-- Input de arquivo oculto e botão de clipe para o Cliente -->
                <input type="file" id="input-anexo-cliente" style="display: none;" onchange="enviarAnexoCliente(event)">
                <button class="btn-anexo-widget" onclick="acionarInputAnexoCliente()" title="Enviar imagem ou ficheiro" style="background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #64748b;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>

                <input type="text" id="input-mensagem" placeholder="Escreva a sua mensagem..." onkeypress="tratarKeyPress(event)">
                <button class="btn-send" onclick="enviarMensagem()">Enviar</button>
            </div>
        </div>
    </div>

    <script src="js/prefixo.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

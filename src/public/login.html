<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mychat - Login do Colaborador</title>

    <script>
        window.prefixoApp = window.location.pathname.match(/^(\/poc\/\d+)/)?.[1] || '';
    </script>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <img id="login-logo-img" src="assets/logo-red.png" alt="Lello" class="login-logo">
                <h2>Cockpit de Atendimento</h2>
            </div>

            <p class="login-subtit">Faça login com suas credenciais para acessar o painel.</p>

            <form id="form-login" onsubmit="realizarLogin(event)">
                <div class="input-group">
                    <label for="email-input">E-mail Corporativo</label>
                    <input type="email" id="email-input" placeholder="seu.email@lello.com.br" required autocomplete="email">
                </div>

                <div class="input-group">
                    <label for="senha-input">Senha</label>
                    <input type="password" id="senha-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div id="msg-erro" class="msg-erro" style="display: none;"></div>

                <button type="submit" id="btn-login" class="btn-login">Entrar no Painel</button>
            </form>

            <!-- Separador visual -->
            <div style="display: flex; align-items: center; margin: 16px 0; gap: 8px;">
                <div style="flex: 1; height: 1px; background: #e2e8f0;"></div>
                <span style="font-size: 11px; color: #94a3b8; font-weight: 600;">OU</span>
                <div style="flex: 1; height: 1px; background: #e2e8f0;"></div>
            </div>

            <!-- Botão de Autenticação Google -->
            <button type="button" onclick="realizarLoginGoogle()" style="width: 100%; padding: 10px; background: #ffffff; color: #334155; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s;">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Entrar com o Google
            </button>
        </div>
    </div>

    <!-- Firebase SDK (Compat para projetos Vanilla JS) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Configuração Única e Centralizada do Firebase -->
    <script src="js/firebase-config.js"></script>

    <script src="js/prefixo.js"></script>
    <script src="js/auth.js"></script>

    <script>
        // Garante o carregamento do logo vermelho com prefixo dinâmico da Vercel
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById('login-logo-img');
            if (logo) {
                const prefixo = window.prefixoApp || '';
                logo.src = prefixo ? prefixo + '/assets/logo-red.png' : 'assets/logo-red.png';
            }
        });
    </script>
</body>
</html>
